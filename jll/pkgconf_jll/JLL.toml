    [[builds.products]]
    path = "bin/pkgconf"
    type = "executable"
    name = "pkgconf"
    [[builds.products]]
    path = "bin/pkg-config"
    type = "executable"
    name = "pkg_config"
    [[builds.products]]
    flags = ["RTLD_DEEPBIND", "RTLD_LAZY"]
    path = "lib/libpkgconf.so.5.0.0"
    linkage = "dynamic"
    type = "library"
    name = "libpkgconf"
    soname = "libpkgconf.so.5"
    system_deps = ["c"]
    deps = []

    [builds.auxilliary_artifacts.extract_log]
    treehash = "sha1:6040e6efefe6e4d379ff7f4213e9981094f4a2ad"
    download_sources = []

    [builds.auxilliary_artifacts.build_log]
    treehash = "sha1:8d121a31122beb1338ee488bad98ea8eef96564b"
    download_sources = []

    [[builds.sources]]
    treehash = "sha1:02340b44ac3e19e28ea363da3a70487d3babfc52"
    url = "https://distfiles.ariadne.space/pkgconf/pkgconf-2.3.0.tar.xz"

    [builds.callback_defs]
