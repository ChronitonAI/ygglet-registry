version = "2.3.1"
format_version = "1.0"
name = "pkgconf"
julia_compat = "1.6"
platform_augmentation_code = ""

[[builds]]
name = "pkgconf"
platform = "x86_64-linux-gnu-rr_softticks+1"
deps = []
lazy = "false"
src_version = "2.3.0"

    [builds.artifact]
    treehash = "sha1:780bb8bd893113f2bf546bfd52496457281172aa"
    download_sources = []

